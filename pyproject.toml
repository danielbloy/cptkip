# See: https://packaging.python.org/en/latest/overview/
[build-system]
requires = ["setuptools >= 82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cptkip"
version = "0.3.6"
requires-python = ">= 3.12, < 3.15"
description = "Circuit Python Toolkit for Interactive Projects"
readme = "README.md"
# Desktop runtime dependencies. On CircuitPython devices the equivalent libraries are
# copied from CircuitPython/<version>/lib instead (see development_environment.md).
dependencies = [
    "adafruit-circuitpython-debouncer",
    "adafruit-circuitpython-led-animation",
    "adafruit-circuitpython-neopixel",
    "psutil",
    "requests",
]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 5 - Production/Stable",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Include every subpackage (cptkip.core, cptkip.task, ...) not just the top level,
# plus the placeholder MP3 used by cptkip.device.audio.
[tool.setuptools.packages.find]
include = ["cptkip*"]

[tool.setuptools.package-data]
cptkip = ["mp3.mp3"]

[tool.pytest.ini_options]
pythonpath = "."
